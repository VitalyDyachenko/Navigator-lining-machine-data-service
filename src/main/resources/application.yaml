server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  config:
    import: file:.env[.properties]
  application:
    name: navigator

  datasource:
    url: jdbc:postgresql://localhost:5432/navigator
    username: ${DB_USERNAME:navigator}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

springdoc:
  swagger-ui:
    default-models-expand-depth: -1 # Скрывает секцию Schemas/Models внизу страницы